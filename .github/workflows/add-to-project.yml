name: Add to Project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    if: github.repository_owner == 'microsoft'
    steps:
      - name: Add to project
        uses: actions/add-to-project@v0.5.0
        with:
          # Configure the Ignite GitHub Project URL
          project-url: ${{ vars.IGNITE_PROJECT_URL || 'https://github.com/orgs/microsoft/projects/ignite-2025' }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT || secrets.GITHUB_TOKEN }}

  label_issues:
    name: Label issues
    runs-on: ubuntu-latest
    if: github.repository_owner == 'microsoft'
    steps:
      - name: Label new issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['needs-triage', 'ignite-session']
              });
              console.log('Successfully added labels to issue #' + context.issue.number);
            } catch (error) {
              console.log('Failed to add labels:', error.message);
              // Don't fail the workflow if labeling fails
            }